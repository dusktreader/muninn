apiVersion: batch/v1
kind: Job
metadata:
  name: muninn-jetstream-provision
  annotations:
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {app: muninn-jetstream-provision}
    spec:
      restartPolicy: Never
      containers:
        - name: provision
          image: {{ .Values.api.image | quote }}
          command: ["python", "-m", "muninn.queue.provision"]
          envFrom:
            - configMapRef: {name: muninn-config}
            - secretRef: {name: muninn-runtime}
