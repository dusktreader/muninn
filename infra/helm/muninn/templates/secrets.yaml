{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "muninn-runtime" -}}
{{- $existingSecretData := dict -}}
{{- if $existingSecret -}}
{{- $existingSecretData = $existingSecret.data -}}
{{- end -}}
{{- $accessKey := .Values.minio.accessKey | default (get $existingSecretData "MUNINN_OBJECT_STORE_ACCESS_KEY" | b64dec) | default (randAlphaNum 20) -}}
{{- $secretKey := .Values.minio.secretKey | default (get $existingSecretData "MUNINN_OBJECT_STORE_SECRET_KEY" | b64dec) | default (randAlphaNum 40) -}}
{{- $grantSecret := get $existingSecretData "MUNINN_ARTIFACT_GRANT_SECRET" | b64dec | default (randAlphaNum 64) -}}
apiVersion: v1
kind: Secret
metadata:
  name: muninn-runtime
type: Opaque
stringData:
  MUNINN_OBJECT_STORE_ACCESS_KEY: {{ $accessKey | quote }}
  MUNINN_OBJECT_STORE_SECRET_KEY: {{ $secretKey | quote }}
  MUNINN_ARTIFACT_GRANT_SECRET: {{ $grantSecret | quote }}

