apiVersion: v1
kind: ConfigMap
metadata:
  name: muninn-config
data:
  MUNINN_ENVIRONMENT: "{{ .Values.environment }}"
  MUNINN_AUTH_MODE: "{{ .Values.auth.mode }}"
  MUNINN_PROVIDER_MODE: "{{ .Values.provider.mode }}"
  MUNINN_ASSEMBLYAI_API_BASE_URL: "{{ .Values.provider.apiBaseUrl }}"
  MUNINN_ASSEMBLYAI_LLM_BASE_URL: "{{ .Values.provider.llmBaseUrl }}"
  MUNINN_ASSEMBLYAI_TRANSCRIPTION_MODEL: "{{ .Values.provider.transcriptionModel }}"
  MUNINN_ASSEMBLYAI_SUMMARY_MODEL: "{{ .Values.provider.summaryModel }}"
  MUNINN_DATABASE_URL: "postgresql+psycopg://muninn@muninn-postgresql:5432/muninn"
  MUNINN_NATS_URL: "nats://muninn-nats:4222"
  MUNINN_OBJECT_STORE_ENDPOINT: "http://muninn-minio:9000"
  MUNINN_OBJECT_STORE_BUCKET: "muninn"
{{ if eq .Values.auth.mode "oidc" }}
  MUNINN_PUBLIC_HOSTNAME: {{ required "global.publicHostname is required when auth.mode is oidc" .Values.global.publicHostname | quote }}
  MUNINN_OIDC_ISSUER_URL: {{ required "keycloak.issuerUrl is required when auth.mode is oidc" .Values.keycloak.issuerUrl | quote }}
  MUNINN_OIDC_JWKS_URL: {{ required "keycloak.jwksUrl is required when auth.mode is oidc" .Values.keycloak.jwksUrl | quote }}
  MUNINN_OIDC_AUDIENCE: {{ required "keycloak.audience is required when auth.mode is oidc" .Values.keycloak.audience | quote }}
  MUNINN_OIDC_CLIENT_ID: {{ required "keycloak.clientId is required when auth.mode is oidc" .Values.keycloak.clientId | quote }}
{{ end }}
