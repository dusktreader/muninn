[project]
name = "muninn"
version = "0.1.0"
description = "Offline-first conversation capture and agent context service"
authors = [{name = "Tucker Beck", email = "tucker.beck@gmail.com"}]
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = "==3.15.0"
dependencies = [
    "alembic==1.20.1",
    "auto-name-enum==4.2.0",
    "boto3==1.44.9",
    "click==8.5.1",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "inflection==0.5.1",
    "loguru==0.8.0",
    "psycopg[binary]==3.3.9",
    "py-buzz==9.0.1",
    "pyjwt[crypto]==2.15.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "nats-py==2.17.0",
    "sqlalchemy==2.1.9",
    "uvicorn==0.54.0",
    "snick>=3.2.0",
]

[project.urls]
homepage = "https://github.com/dusktreader/muninn"
source = "https://github.com/dusktreader/muninn"

[project.scripts]
muninn-job-manager = "muninn.job_manager.main:main"
muninn-worker = "muninn.worker.main:main"

[dependency-groups]
dev = [
    "debugpy==1.8.12",
    "ipython==8.32.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-pretty==1.2.0",
    "ruff==0.9.7",
    "testcontainers==4.10.0",
    "ty==0.0.75",
    "typos==1.29.10",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = ["--cov=src/muninn", "--cov-report=term-missing", "--cov-report=xml:../.coverage.xml"]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: fast tests that do not require external services",
    "integration: tests that exercise local service dependencies and free Zen models",
    "e2e: end-to-end tests that exercise the complete local application",
]

[tool.ruff]
line-length = 120
src = ["src/muninn", "tests"]

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.format]
docstring-code-format = true

[tool.typos.default]
extend-ignore-identifiers-re = ["ane_auto"]

[build-system]
requires = ["uv-build>=0.1.0"]
build-backend = "uv_build"
